name: Electron desktop

on:
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron --version
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm package:win
      - name: Test packaged application
        run: |
          $env:MYLIKE_EXECUTABLE = Join-Path $PWD 'dist/win-unpacked/MyLike.exe'
          pnpm test:e2e --fully-parallel --shard=${{ matrix.shard }}/4
      - name: Test portable launcher
        if: matrix.shard == 1
        run: node tests/portable-smoke.mjs
      - name: Create checksums
        if: matrix.shard == 1
        run: |
          $files = Get-ChildItem dist/*.exe, dist/*.zip | Sort-Object Name
          if ($files.Count -ne 2) { throw 'Expected one portable EXE and one ZIP.' }
          $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          ($lines -join "`n") + "`n" | Set-Content dist/SHA256SUMS.txt -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 1
        with:
          name: MyLike-Windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MyLike-Windows-test-results-${{ matrix.shard }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
