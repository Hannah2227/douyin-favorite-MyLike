name: Electron desktop

on:
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron --version
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm package:win
      - name: Test SQLite without a writable system temp directory
        if: matrix.shard == 1
        run: pnpm test:storage
      - name: Test packaged application
        run: |
          $env:MYLIKE_EXECUTABLE = Join-Path $PWD 'dist/win-unpacked/MyLike.exe'
          pnpm test:e2e --fully-parallel --shard=${{ matrix.shard }}/4
      - name: Test Windows installation and removal
        if: matrix.shard == 1
        run: node tests/installer-smoke.mjs --fresh-user
      - name: Create checksums
        if: matrix.shard == 1
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "dist/MyLike-$version-win-x64-setup.exe" -ErrorAction Stop
          $lines = '{0}  {1}' -f (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $installer.Name
          ($lines -join "`n") + "`n" | Set-Content dist/SHA256SUMS.txt -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 1
        with:
          name: MyLike-Windows-x64
          path: |
            apps/desktop/dist/*-win-x64-setup.exe
            apps/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MyLike-Windows-test-results-${{ matrix.shard }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
