<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>播放</title>
<style>
:root { --accent:#fe2c55; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif;user-select:none}
#dsh-root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#dsh-video{width:100vw;height:100vh;object-fit:contain;cursor:pointer;outline:none;background:#000}
#dsh-slide{max-width:100vw;max-height:100vh;object-fit:contain;cursor:pointer;display:none}
#dsh-audio{display:none}
#dsh-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.55);padding:14px 26px;border-radius:50px;font-size:16px;display:none;pointer-events:none;z-index:5}
#dsh-load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px;display:none;align-items:center;gap:10px;background:rgba(0,0,0,.5);padding:12px 22px;border-radius:24px;z-index:5}
#dsh-load .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#dsh-slide-prev,#dsh-slide-next{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:3}
#dsh-slide-prev{left:16px}
#dsh-slide-next{right:16px}
#dsh-slide-prev:hover,#dsh-slide-next:hover{background:rgba(0,0,0,.65)}
#dsh-ctrl{position:absolute;bottom:0;left:0;right:0;display:flex;gap:22px;align-items:center;justify-content:center;padding-bottom:18px;z-index:3;background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
#dsh-ctrl button{background:transparent;border:none;color:#fff;font-size:20px;width:46px;height:46px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
#dsh-ctrl button:hover{background:rgba(255,255,255,.15)}
#dsh-ctrl button:disabled{opacity:.3;cursor:default}
#dsh-ctrl button:disabled:hover{background:transparent}
#dsh-ctrl button.dng{color:#ff8da1}
#dsh-ctrl button.dng:hover{background:rgba(254,44,85,.5);color:#fff}
#dsh-ctrl button.on{color:var(--accent)}
#dsh-toggle{font-size:26px !important;width:54px !important;height:54px !important}
#dsh-page,#dsh-fs,#dsh-mute{font-size:15px !important}
#dsh-auto{width:auto !important;min-width:50px;padding:0 8px;font-size:13px !important;letter-spacing:.5px}
/* 音量控件:点击图标=静音开关;悬停按钮上方弹出水平滑条调音量 */
#dsh-vol-wrap{position:relative;display:flex;align-items:center}
/* 音量控件:点击图标=静音开关;悬停按钮上方弹出垂直滑条调音量 */
#dsh-vol-wrap{position:relative;display:flex;align-items:center}
#dsh-vol{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);width:26px;height:110px;margin:0;display:none;cursor:pointer;writing-mode:vertical-lr;direction:rtl;accent-color:var(--accent);background:rgba(20,20,24,.85);border-radius:6px}
#dsh-vol-wrap:hover #dsh-vol,#dsh-vol-wrap.ui-open #dsh-vol{display:block}
#dsh-info{position:absolute;left:24px;right:24px;bottom:96px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;text-align:left;z-index:3}
#dsh-title{font-size:15px;line-height:1.5;max-height:45px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
#dsh-author{font-size:12px;opacity:.85;margin-top:8px}
#dsh-time{font-size:12px;opacity:.6;margin-left:10px}
#dsh-pb{position:absolute;left:0;right:0;bottom:74px;height:16px;cursor:pointer;z-index:3}
#dsh-pb-track{position:absolute;left:0;right:0;bottom:7px;height:3px;background:rgba(255,255,255,.3);border-radius:2px}
#dsh-pb-fill{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
#dsh-pb-thumb{position:absolute;bottom:4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent);transform:scale(.7);opacity:.8;transition:transform .15s,opacity .15s;box-shadow:0 0 6px rgba(254,44,85,.6)}
#dsh-pb:hover #dsh-pb-thumb,#dsh-pb.dragging #dsh-pb-thumb{transform:scale(1);opacity:1}
#dsh-pb-tip{position:absolute;bottom:26px;color:#fff;font-size:12px;background:rgba(0,0,0,.75);padding:4px 8px;border-radius:5px;pointer-events:none;white-space:nowrap;display:none}
#dsh-close{position:absolute;top:14px;right:18px;color:#fff;font-size:24px;background:none;border:none;cursor:pointer;z-index:3}
#dsh-close:hover{color:var(--accent)}
#dsh-qbtn.active{background:rgba(254,44,85,.22);color:var(--accent)}
#dsh-qbtn{font-size:12px}
#dsh-qpanel{position:absolute;top:0;right:0;bottom:0;width:300px;background:rgba(14,14,18,.94);border-left:1px solid rgba(255,255,255,.09);z-index:6;display:flex;flex-direction:column;color:#e8e8ea}
#dsh-qpanel.hidden{display:none}
#dsh-qpanel .qhead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:13px;color:#fff;border-bottom:1px solid rgba(255,255,255,.1);flex:none}
#dsh-qpanel .qhead button{background:none;border:none;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;padding:2px 6px}
#dsh-qpanel .qhead button:hover{color:#fff}
#dsh-qlist{flex:1;overflow-y:auto;padding:4px 0;scrollbar-width:none}
#dsh-qlist::-webkit-scrollbar{display:none}   /* 滚轮控制列表,隐藏拖动条 */
#dsh-qpanel .qrow{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;line-height:1.3;cursor:pointer;color:#cfcfd3;min-height:50px}
#dsh-qpanel .qrow:hover{background:rgba(255,255,255,.06)}
#dsh-qpanel .qrow.cur{background:rgba(254,44,85,.14)}
#dsh-qpanel .qrow .idx{flex:none;color:rgba(255,255,255,.32);font-size:11px;min-width:26px;text-align:right}
#dsh-qpanel .qrow .th{flex:none;width:42px;height:42px;border-radius:6px;object-fit:cover;background:#22242a}
#dsh-qpanel .qrow .th-ph{flex:none;width:42px;height:42px;border-radius:6px;background:linear-gradient(135deg,#23252b,#191b20)}
#dsh-qpanel .qrow .tt{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
#dsh-qpanel .qrow .tag{flex:none;font-size:10px;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.22);border-radius:3px;padding:0 3px}
#dsh-qpanel .qrow .t1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5d5da}
#dsh-qpanel .qrow.cur .t1{color:var(--accent)}
/* 播放页 UI 升级:顶部遮罩 / 时间码 / seek 提示 / 胶囊按钮 / 呼吸高亮 */
#dsh-topmask{position:absolute;top:0;left:0;right:0;height:140px;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);pointer-events:none;z-index:2}
#dsh-tcode{position:absolute;right:26px;bottom:90px;color:rgba(255,255,255,.92);font-size:12px;text-shadow:0 1px 4px rgba(0,0,0,.85);pointer-events:none;z-index:3;font-variant-numeric:tabular-nums}
#dsh-toast{position:absolute;top:78px;left:50%;transform:translateX(-50%);max-width:74%;background:rgba(18,18,24,.94);color:#fff;font-size:13px;line-height:1.5;padding:9px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:9;opacity:0;pointer-events:none;transition:opacity .22s ease;text-align:center}
#dsh-toast.show{opacity:1}
#dsh-toast.err{color:#ff8da1;border-color:rgba(254,44,85,.5)}
#dsh-seektip{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:#fff;font-size:36px;font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.75);letter-spacing:1px;opacity:0;pointer-events:none;z-index:5;transition:opacity .22s}
#dsh-ctrl{gap:14px}
#dsh-ctrl button.wbtn{width:auto;min-width:52px;height:34px;padding:0 13px;border-radius:17px;font-size:13px !important;background:rgba(255,255,255,.1);letter-spacing:.3px}
#dsh-ctrl button.wbtn:hover{background:rgba(255,255,255,.24);color:var(--accent)}
#dsh-ctrl button.wbtn.on{background:rgba(254,44,85,.2);color:#fff}
#dsh-qpanel .qrow{position:relative}
@keyframes dshqbreath{0%,100%{background:rgba(254,44,85,.12)}50%{background:rgba(254,44,85,.34);box-shadow:inset 0 0 18px rgba(254,44,85,.22)}}
#dsh-qpanel .qrow.cur{background:rgba(254,44,85,.16);animation:dshqbreath 2.2s ease-in-out infinite}
#dsh-qpanel .qrow.cur::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
/* 虚拟列表:行绝对定位铺在占位容器(高度=行数*行高);行高固定,勿改行内容使其变高 */
#dsh-qlist{position:relative}
.qsizer{position:relative;width:100%}
#dsh-qpanel .qrow{position:absolute;left:0;right:0;top:0;height:52px;margin:0;padding:0 10px;min-height:0}
#dsh-qpanel .qrow .idx{min-width:24px}
#dsh-failmsg{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.75);padding:16px 24px;border-radius:10px;display:none;text-align:center;font-size:14px;z-index:4}
#dsh-failmsg button{background:rgba(254,44,85,.85);border:none;color:#fff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;margin-top:10px}
#dsh-failmsg button.ghost{background:rgba(255,255,255,.15);margin-left:8px}
/* UI 自动隐藏:鼠标移动显示,1.6s 无操作淡出;悬停控制区保持 */
#dsh-ctrl,#dsh-pb,#dsh-info,#dsh-close,#dsh-slide-prev,#dsh-slide-next{opacity:0;transition:opacity .3s ease;pointer-events:none}
#dsh-root.ui-on #dsh-ctrl,#dsh-root.ui-on #dsh-pb,#dsh-root.ui-on #dsh-info,#dsh-root.ui-on #dsh-close,
#dsh-root.ui-on #dsh-slide-prev,#dsh-root.ui-on #dsh-slide-next,
#dsh-root.ui-hold #dsh-ctrl,#dsh-root.ui-hold #dsh-pb,#dsh-root.ui-hold #dsh-info,#dsh-root.ui-hold #dsh-close,
#dsh-root.ui-hold #dsh-slide-prev,#dsh-root.ui-hold #dsh-slide-next{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="dsh-root">
  <video id="dsh-video" playsinline></video>
  <img id="dsh-slide" alt=""/>
  <button id="dsh-slide-prev" title="上一张">&#9664;</button>
  <button id="dsh-slide-next" title="下一张">&#9654;</button>
  <audio id="dsh-audio"></audio>
  <div id="dsh-load"><span class="spin"></span><span id="dsh-load-text">正在获取播放地址…</span></div>
  <div id="dsh-hint">&#9654; 点击播放</div>
  <div id="dsh-failmsg">该内容暂时无法播放<br/><button id="dsh-fail-skip">跳过</button><button class="ghost" id="dsh-fail-page">原页播放</button></div>
  <div id="dsh-info"><div id="dsh-title"></div><div><span id="dsh-author-name"></span><span id="dsh-time"></span></div></div>
  <div id="dsh-pb"><div id="dsh-pb-track"><i id="dsh-pb-fill"></i></div><div id="dsh-pb-thumb"></div><div id="dsh-pb-tip"></div></div>
  <div id="dsh-ctrl">
    <button id="dsh-prev" title="上一首(↑)">&#9198;</button>
    <button id="dsh-toggle" title="播放/暂停(空格)">&#9654;</button>
    <button id="dsh-next" title="下一首(↓)">&#9197;</button>
    <span id="dsh-vol-wrap" title="">
      <button id="dsh-mute" title="静音(M),悬停上方滑条调音量">&#128266;</button>
      <input id="dsh-vol" type="range" min="0" max="100" value="100" title="音量" />
    </span>
    <button id="dsh-auto" class="wbtn" title="自动连播:关(按 A 开启)">连播关</button>
    <button id="dsh-speed" class="wbtn" title="倍速:点击循环切换">1x</button>
    <button id="dsh-page" class="wbtn" title="打开抖音原视频页看评论,关闭后返回继续播放">评论</button>
    <button id="dsh-unlike" class="wbtn dng" title="在抖音取消这条的点赞(不可逆),并从本地移除">取消点赞</button>
    <button id="dsh-fs" class="wbtn" title="全屏(F / 双击画面)">全屏</button>
    <button id="dsh-qbtn" class="wbtn" title="播放列表(Q):查看/跳转队列">播放列表</button>
  </div>
  <button id="dsh-close" title="停止并返回列表(Esc)">&#10005;</button>
  <div id="dsh-topmask"></div>
  <div id="dsh-seektip"></div>
  <div id="dsh-tcode"></div>
  <div id="dsh-toast"></div>
  <aside id="dsh-qpanel" class="hidden">
    <div class="qhead"><span id="dsh-qhead-title">播放列表</span><button id="dsh-qclose" title="收起侧栏">&#10005;</button></div>
    <div id="dsh-qlist"></div>
  </aside>
</div>
<script>
(function () {
  function post(d) { try { window.chrome.webview.postMessage(d); } catch (e) {} }
  function $(id) { return document.getElementById(id); }

  var root = $('dsh-root'), video = $('dsh-video'), img = $('dsh-slide'), audio = $('dsh-audio'), hint = $('dsh-hint');

  // 模块级状态(跨 show 共享,防旧定时器串台)
  var slideTimer = null, slideIdx = 0, slideImages = [], slidePaused = false;
  var stallTimer = null, showSeq = 0, muted = false, volume = 100, lastVol = 100, autoNext = false;
  var curIdxShown = -1;   // 当前播放的全局序号(播放列表跟随用)
  var playTotal = 0;      // 当前播放队列总数(边界禁用判断用)
  // 手动上一首/下一首的边界守卫:第一条禁"上一条"、最后一条禁"下一条"。
  // 注意只守"手动入口"(按钮/方向键/滚轮)——自动连播播到队尾仍需发 next 让宿主收尾返回列表,
  // 因此不能在后端直接吞掉 next 边界,前端守卫最合适。
  function navAtStart() { return curIdxShown <= 0; }
  function navAtEnd() { return playTotal > 0 && curIdxShown >= playTotal - 1; }
  function updateNavState() {
    var p = $('dsh-prev'), n = $('dsh-next');
    if (p) p.disabled = navAtStart();
    if (n) n.disabled = navAtEnd();
  }

  // ---------- 播放页内单条取消点赞 ----------
  var unlikeDoneIdx = -1;   // 本次会话已取消的队列序号(切歌后按序号复位/置灰)
  var toastTimer = null;
  function showPlayerToast(text, isErr) {
    var el = $('dsh-toast');
    if (!el) return;
    el.textContent = text || '';
    el.classList.toggle('err', !!isErr);
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }
  function syncUnlikeBtn() {
    var b = $('dsh-unlike');
    if (!b) return;
    var done = curIdxShown === unlikeDoneIdx;
    b.disabled = done;
    b.textContent = done ? '已取消' : '取消点赞';
    b.title = done ? '本条已取消点赞' : '在抖音取消这条的点赞(不可逆),并从本地移除';
  }
  // 宿主单条 unlike 回执:ok=true → 本条标记"已取消"(不可再点);失败 → 按钮复位可重试
  window.__dshUnlikeDone = function (ok, text) {
    if (ok) unlikeDoneIdx = curIdxShown;
    showPlayerToast(text || (ok ? '已取消点赞' : '取消失败'), !ok);
    syncUnlikeBtn();
  };

  function updateToggleIcon(playing) { $('dsh-toggle').innerHTML = playing ? '&#9208;' : '&#9654;'; }
  // 音量应用 + 图标/滑块同步:静音图标随"静音开关或音量=0"显示 🔇;静音时滑块仍保留原音量值
  function updateMuteIcon() {
    var silent = muted || volume <= 0;
    $('dsh-mute').innerHTML = silent ? '&#128263;' : '&#128266;';
    $('dsh-mute').title = silent ? '已静音,点击或拖滑条恢复声音(M)' : '静音(M),悬停上方滑条调音量';
    var s = $('dsh-vol');
    if (s && s.value != volume) s.value = volume;
  }
  function applyVol() {
    try {
      var m = muted || volume <= 0;
      video.muted = m; audio.muted = m;
      video.volume = volume / 100; audio.volume = volume / 100;
    } catch (e) {}
  }
  // 自动连播:设置开关 + 刷新按钮态(title/高亮);C# 每次 Show 带 cfg.autoNext 作为初值,切歌后状态同步
  function setAutoNext(on) {
    autoNext = !!on;
    var b = $('dsh-auto');
    if (!b) return;
    b.textContent = autoNext ? '连播开' : '连播关';   // 文字按钮:开/关即当前状态(高亮=已开启)
    b.classList.toggle('on', autoNext);
    b.title = autoNext ? '自动连播:开(按 A 关闭)' : '自动连播:关(按 A 开启)';
  }
  function toggleAutoNext() {
    setAutoNext(!autoNext);
    post({ player: 'autonext', on: autoNext });   // 上报宿主持久化(宿主回写幂等,保证单一最终态)
  }
  window.__dshSetAutoNext = setAutoNext;
  function hideHint() { hint.style.display = 'none'; }
  function showLoader(text) { if (text) $('dsh-load-text').textContent = text; $('dsh-load').style.display = 'flex'; }
  function hideLoader() { $('dsh-load').style.display = 'none'; }

  // ---------- UI 自动隐藏 ----------
  var uiTimer = null;
  function uiShow() {
    root.classList.add('ui-on'); root.classList.remove('ui-hold');
    if (uiTimer) { clearTimeout(uiTimer); uiTimer = null; }
    uiTimer = setTimeout(function () { root.classList.remove('ui-on'); uiTimer = null; }, 1600);
  }
  function uiHold() { if (uiTimer) { clearTimeout(uiTimer); uiTimer = null; } root.classList.add('ui-hold'); root.classList.remove('ui-on'); }
  function uiResume() { root.classList.remove('ui-hold'); uiShow(); }
  root.addEventListener('mousemove', function () { if (root.classList.contains('ui-hold')) return; uiShow(); });
  ['dsh-ctrl', 'dsh-pb', 'dsh-info', 'dsh-vol-wrap'].forEach(function (id) {
    var el = $(id); if (!el) return;
    el.addEventListener('pointerenter', uiHold);
    el.addEventListener('pointerleave', uiResume);
  });

  // ---------- 播放/暂停 ----------
  function attemptPlay() {
    hideHint();
    video.__dsh_user_paused__ = false;
    var p = video.play();
    if (p && p.catch) p.catch(function () {});
  }
  function togglePlay() {
    hideHint();                          // 真实手势
    if (slideImages.length > 0) { toggleSlide(); return; }
    if (video.paused || video.ended) attemptPlay();
    else { video.__dsh_user_paused__ = true; video.pause(); }
  }

  // ---------- 图集轮播 ----------
  function updateSlideProgress() {
    var total = slideImages.length || 0;
    var pct = total ? ((slideIdx + 1) / total * 100) : 0;
    $('dsh-pb-fill').style.width = pct + '%';
    $('dsh-pb-thumb').style.left = pct + '%';
  }
  function slideTick() {
    slideIdx++;
    if (slideIdx >= slideImages.length) {
      slideIdx = 0;                      // 循环
      img.src = slideImages[0];
      updateSlideProgress();
      try { if (audio.ended) { audio.currentTime = 0; var ap = audio.play(); if (ap && ap.catch) ap.catch(function () {}); } } catch (e) {}
      return;
    }
    img.src = slideImages[slideIdx];
    updateSlideProgress();
  }
  function toggleSlide() {
    if (slidePaused) {
      slidePaused = false;
      slideTimer = setInterval(slideTick, 2000);
      hideHint();
      try { if (audio.src) { var ap = audio.play(); if (ap && ap.catch) ap.catch(function () {}); } } catch (e) {}
      updateToggleIcon(true);
    } else {
      slidePaused = true;
      if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
      try { audio.pause(); } catch (e) {}
      updateToggleIcon(false);
    }
  }
  function slideStep(delta) {
    var n = slideImages.length;
    if (n === 0) return;
    slideIdx = (slideIdx + delta + n) % n;
    img.src = slideImages[slideIdx];
    if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
    slidePaused = true;                  // 手动切图 → 固定当前图
    updateSlideProgress();
    updateToggleIcon(false);
  }

  // ---------- 滚轮切歌(抖音式) ----------
  var lastSwitch = 0;
  root.addEventListener('wheel', function (e) {
    e.preventDefault();
    var now = Date.now();
    if (now - lastSwitch < 600) return;
    if (Math.abs(e.deltaY) < 40) return;
    lastSwitch = now;
    if (e.deltaY > 0) { if (navAtEnd()) return; post({ player: 'next' }); }
    else { if (navAtStart()) return; post({ player: 'prev' }); }
  }, { passive: false });

  root.addEventListener('click', function (e) {
    // 按钮/进度条/音量控件的 click 不触发播放/暂停

  function toggleFs() { post({ player: 'fullscreen' }); }

  function toggleMute() {
    if (muted || volume <= 0) {
      muted = false;
      if (volume <= 0) volume = lastVol > 0 ? lastVol : 100;
    } else {
      lastVol = volume;
      muted = true;
    }
    applyVol();
    updateMuteIcon();
  }

  $('dsh-toggle').onclick = function (e) { e.stopPropagation(); togglePlay(); };
  $('dsh-prev').onclick = function (e) { e.stopPropagation(); post({ player: 'prev' }); };
  $('dsh-next').onclick = function (e) { e.stopPropagation(); post({ player: 'next' }); };
  $('dsh-unlike').onclick = function (e) {
    e.stopPropagation();

  $('dsh-page').onclick = function (e) { e.stopPropagation(); post({ player: 'openpage' }); };
  $('dsh-close').onclick = function (e) { e.stopPropagation(); post({ player: 'close' }); };
  $('dsh-fs').onclick = function (e) { e.stopPropagation(); toggleFs(); };
  $('dsh-mute').onclick = function (e) { e.stopPropagation(); toggleMute(); };
  $('dsh-auto').onclick = function (e) { e.stopPropagation(); toggleAutoNext(); };

  $('dsh-vol').addEventListener('input', function () {

  // ---------- 键盘 ----------
  document.addEventListener('keydown', function (e) {

      case 'ArrowLeft':

        else { e.preventDefault(); seekBy(-10); }

      case 'ArrowRight':

  // ---------- 进度条(视频=seek;图集=选图) ----------
  var pbEl = $('dsh-pb'), pbThumb = $('dsh-pb-thumb'), pbTip = $('dsh-pb-tip'), pbFill = $('dsh-pb-fill');
  var pbDragging = false;

  function pbRatioFromX(clientX) {
    var r = pbEl.getBoundingClientRect();
    var ratio = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(1, ratio));
  }
  function pbUpdateThumb() {
    var ratio = 0;
    if (slideImages.length > 0) ratio = slideImages.length ? ((slideIdx + 1) / slideImages.length) : 0;
    else if (video.duration && isFinite(video.duration)) ratio = video.currentTime / video.duration;
    pbFill.style.width = (ratio * 100) + '%';
    pbThumb.style.left = (ratio * 100) + '%';
  }
  function pbSeek(ratio) {
    if (slideImages.length > 0) {
      var idx = Math.floor(ratio * slideImages.length);
      if (idx >= slideImages.length) idx = slideImages.length - 1;
      if (idx < 0) idx = 0;
      if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
      slidePaused = true;
      slideIdx = idx;
      img.src = slideImages[idx];
      updateSlideProgress();
      updateToggleIcon(false);
      pbTip.textContent = (idx + 1) + '/' + slideImages.length;
      return;
    }
    if (video.duration && isFinite(video.duration)) {
      video.currentTime = ratio * video.duration;
      pbUpdateThumb();
    }
  }
  function pbShowTip(clientX) {
    var ratio = pbRatioFromX(clientX);
    if (slideImages.length > 0) {
      var idx = Math.min(slideImages.length - 1, Math.floor(ratio * slideImages.length));
      pbTip.textContent = (idx + 1) + '/' + slideImages.length;
    } else if (video.duration && isFinite(video.duration)) {
      var secs = Math.floor(ratio * video.duration);
      var m = Math.floor(secs / 60), s = secs % 60;
      pbTip.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    } else {
      pbTip.textContent = '';

    evt.stopPropagation();

    pbSeek(pbRatioFromX(evt.clientX));

  pbEl.addEventListener('pointermove', function (evt) {

  // ---------- 视频事件 ----------
  // 播放结束:自动连播开 → 通知宿主切下一条(宿主侧自动跳过失效/到队尾停止);
  // 关 → 本地循环当前条(现状)。图文模式以 BGM 结束为界(同抖音)。
  video.addEventListener('ended', function () {
    if (autoNext) { post({ player: 'next' }); return; }
    try { video.currentTime = 0; video.play(); } catch (e) {}
  });
  audio.addEventListener('ended', function () {

  video.addEventListener('play', function () { hideHint(); updateToggleIcon(true); });
  video.addEventListener('pause', function () { updateToggleIcon(false); });
  var lastProgress = 0;
  video.addEventListener('timeupdate', function () {

  });

  // ---------- C# → 页面命令 ----------
  // 取链中(loader)

    showLoader(text);
    $('dsh-failmsg').style.display = 'none';
  };

  // 播放(cfg:{urls,images,music,title,author,time,resume,index,total})
  window.__dshPlayerShow = function (cfg) {
    hideLoader();
    var mySeq = ++showSeq;
    stopStallCheck();
    root.classList.add('ui-on');
    uiShow();
    applyVol();   // 恢复/保持用户音量设置(静音或自定义音量)
    setAutoNext(!!cfg.autoNext);   // 同步宿主自动连播开关(初值/切歌后)

    var titleText = cfg.title || '';
    if (titleText.length > 60) titleText = titleText.slice(0, 60) + '…';
    curIdxShown = cfg.index;
    playTotal = cfg.total || 0;
    updateNavState();   // 第一条禁上一条 / 最后一条禁下一条
    syncUnlikeBtn();    // 取消点赞按钮状态跟随当前条目(已取消的保持置灰)
    // 播放队列侧栏(虚拟列表):确保当前行已加载并置顶高亮
    if (qOpen) qSyncCur();
    $('dsh-title').textContent = (cfg.index + 1) + '/' + cfg.total + '  ' + titleText;
    $('dsh-title').title = cfg.title || '';
    $('dsh-author-name').textContent = cfg.author || '';
    $('dsh-time').textContent = cfg.time ? '发布时间:' + cfg.time : '';
    pbFill.style.width = '0';
    $('dsh-failmsg').style.display = 'none';

    // 清理上一轮图集状态
    if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
    slidePaused = false;
    slideImages = [];
    try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch (e) {}

    var images = cfg.images || [];
    if (images.length > 0) {
      // 图集模式
      try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
      video.style.display = 'none';
      img.style.display = 'block';
      $('dsh-slide-prev').style.display = 'flex';
      $('dsh-slide-next').style.display = 'flex';
      slideImages = images;
      slideIdx = 0;
      img.src = images[0];
      if (cfg.music) {
        audio.src = cfg.music;
        var ap = audio.play();
        if (ap && ap.catch) ap.catch(function () {
          if (!audio.error) {
            hint.innerHTML = '&#9654; 点击开启声音';
            hint.style.display = 'block';
          }
        });

      updateToggleIcon(true);

      return;
    }

    // 视频模式
    img.style.display = 'none';
    video.style.display = '';

    var urls = (cfg.urls && cfg.urls.length) ? cfg.urls : (cfg.url ? [cfg.url] : []);
    var vi = 0;

    function loadNext() {
      if (mySeq !== showSeq) return;
      if (vi >= urls.length) {
        $('dsh-failmsg').style.display = 'block';
        post({ player: 'allfailed' });
        return;
      }
      video.removeAttribute('src');
      video.load();
      video.src = urls[vi++];
      video.playbackRate = playRate;   // 换源后 playbackRate 会被重置,重设用户倍速
    }

    // 播放停滞检测:12 秒推进不足 1 秒(真断流)才切下一条
    function stopStallCheck() { if (stallTimer) { clearInterval(stallTimer); stallTimer = null; } }
    function startStallCheck() {
      stopStallCheck();
      var firstT = -1, checks = 0;
      stallTimer = setInterval(function () {
        if (mySeq !== showSeq) { stopStallCheck(); return; }
        if (video.paused || video.__dsh_user_paused__) { checks = 0; return; }
        if (checks === 0) firstT = video.currentTime;
        checks++;
        if (checks >= 6) {
          if (video.currentTime - firstT < 1) { stopStallCheck(); loadNext(); return; }
          checks = 0;

      post({ player: 'diag', w: video.videoWidth, h: video.videoHeight, codec: (video.src || '').indexOf('bytevc1') >= 0 || (video.src || '').indexOf('h265') >= 0 ? 'h265' : 'h264?' });
      if (video.videoWidth > 0) {

          try { video.currentTime = Math.min(cfg.resume, (video.duration || cfg.resume + 5) - 2); } catch (e) {}
        }
        startStallCheck();
        if (video.paused && !video.__dsh_user_paused__) {
          var p = video.play();
          if (p && p.catch) p.catch(function () {
            hint.innerHTML = '&#9654; 点击播放';
            hint.style.display = 'block';
          });

    };

    video.onpause = function () { stopStallCheck(); };
    video.onplay = function () { startStallCheck(); };

    video.__dsh_user_paused__ = false;
    var p0 = video.play();
    if (p0 && p0.catch) p0.catch(function () {});
  };

  window.__dshPlayerHide = function () {
    stopStallCheckSafe();
    if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }

    hideLoader();
    hideHint();

    root.classList.remove('ui-hold');

    try { audio.pause(); } catch (e) {}

  };
  function stopStallCheckSafe() { if (stallTimer) { clearInterval(stallTimer); stallTimer = null; } }

  // ---------- 播放队列侧栏(虚拟列表·滑动窗口) ----------
  // 渲染层:纯虚拟滚动(只渲染视口 ~40 行,absolute 定位,渲染是纯函数)。
  // 数据层:内存只保留连续窗口段 [qStart, qStart+len);滚到段边缘时"串行"拉相邻段
  // (一次最多一个在途请求,忙时只排队最后一个方向);★头部补段后对 scrollTop 做
  // 等量补偿(视口停留原内容,这是"向上滚跳变/错乱"的真正根因修复);
  // 窗口超过上限时从远离当前行的一端裁剪 → 十几万条队列内存/DOM 恒定。
  var qList = $('dsh-qlist'), qHeadTitle = $('dsh-qhead-title');
  var ROWH = 52;                       // 固定行高(与 CSS .qrow 一致)
  var WINMAX = 6000;                   // 窗口段条数上限(超出从远端裁剪)
  var qItems = [];                     // 连续段 [{i,t,g,c}](i=全局序号)
  var qStart = 0;                      // qItems[0] 对应的全局序号
  var qTotal = 0;
  var qOpen = false, qBusy = false;
  var qPend = 0;                       // 排队的边缘方向:+1 下 / -1 上 / 0 无
  var qRenderTick = 0;
  var sizer = document.createElement('div');
  sizer.className = 'qsizer';
  qList.appendChild(sizer);

  function escH(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function qSetHead(t) { if (qHeadTitle) qHeadTitle.textContent = t; }
  function qPost(from, count) { qBusy = true; post({ player: 'queueSlice', from: from, count: count }); }

  // 打开面板:围绕当前行建窗(不拉全量,十几万条也秒开)
  function qOpenLoad() {
    qItems = []; qStart = Math.max(0, (curIdxShown || 0) - 60); qPend = 0;
    sizer.innerHTML = ''; sizer.style.height = '0px';
    qSetHead('加载列表…');
    qPost(qStart, 200);
  }
  // 宿主回传(__dshQueueSlice(items,total,current,from)):严格接续校验,乱序丢弃
  window.__dshQueueSlice = function (items, total, cur, from) {
    qBusy = false;
    qTotal = total;
    if (!qOpen) { qPend = 0; return; }
    var arr = items || [];
    if (qItems.length === 0 && from === qStart) {
      qItems = arr;                                    // 初始窗口
    } else if (from === qStart + qItems.length) {
      qItems = qItems.concat(arr);                     // 尾部续段(视口不动)
    } else if (qItems.length > 0 && from >= 0 && from + arr.length === qStart && arr.length > 0) {
      qItems = arr.concat(qItems);                     // 头部补段
      qStart = from;
      qList.scrollTop += arr.length * ROWH;            // ★ 等量补偿:视口停留在原内容
    } else {
      // 过期/乱序响应 → 丢弃
    }
    if (qItems.length) qSetHead('播放列表(' + qTotal + ')');
    qRender();
    if (qPend) { var d = qPend; qPend = 0; qEdge(d); }
  };
  // 边缘拉段:忙时只排队最后一个方向(串行,无并发乱序)
  function qEdge(dir) {
    if (!qOpen) return;
    if (qBusy) { qPend = dir; return; }
    if (dir > 0) {
      if (qStart + qItems.length >= qTotal) return;    // 已到底
      qPost(qStart + qItems.length, 200);
    } else {
      if (qStart <= 0) return;                         // 已到顶
      var from = Math.max(0, qStart - 200);
      qPost(from, qStart - from);
    }
  }
  // 窗口超限:从远离当前行的一端裁剪(裁头需补偿 scrollTop)
  function qTrim() {
    if (qItems.length <= WINMAX) return;
    var cur = (curIdxShown || 0) - qStart;
    if (cur > qItems.length / 2) {
      var cut = Math.min(2000, cur - 200);
      if (cut <= 0) return;
      qItems = qItems.slice(cut); qStart += cut;
      qList.scrollTop = Math.max(0, qList.scrollTop - cut * ROWH);
    } else {
      var keep = Math.max(cur + 200, qItems.length - 2000);
      if (keep < qItems.length) qItems = qItems.slice(0, keep);
    }
  }
  // 渲染:纯函数(scrollTop → 可见行)
  function qRender() {
    if (!qOpen || !qItems.length) return;
    var sc = qList.scrollTop || 0, ch = qList.clientHeight || 300;
    sizer.style.height = (qItems.length * ROWH) + 'px';
    var start = Math.max(0, Math.floor(sc / ROWH) - 4);
    var end = Math.min(qItems.length, Math.ceil((sc + ch) / ROWH) + 4);
    var html = '';
    for (var k = start; k < end; k++) {
      var it = qItems[k];
      html += '<div class="qrow' + (it.i === curIdxShown ? ' cur' : '') + '" data-i="' + it.i + '" style="top:' + (k * ROWH) + 'px">'
        + '<span class="idx">' + (it.i + 1) + '</span>'
        + (it.c ? '<img class="th" loading="lazy" src="' + escH(it.c) + '" onerror="this.outerHTML=\'<span class=&quot;th th-ph&quot;></span>\'"/>' : '<span class="th th-ph"></span>')
        + '<span class="tt">' + (it.g ? '<span class="tag">图集</span>' : '') + '<span class="t1">' + escH(it.t || '(无标题)') + '</span></span></div>';
    }
    sizer.innerHTML = html;
  }
  // 滚动边缘检测(距顶/底 2 行内 → 拉相邻段)+ 窗口裁剪
  function qEdgeDetect() {
    var sc = qList.scrollTop || 0, ch = qList.clientHeight || 300;
    var max = qItems.length * ROWH - ch;
    if (sc <= ROWH * 2 && qStart > 0) qEdge(-1);
    else if (max > 0 && sc >= max - ROWH * 2 && qStart + qItems.length < qTotal) qEdge(1);
    qTrim();
  }
  // 当前行跟随(切歌/打开):在窗内 → 置顶;不在 → 围绕它重建窗口
  function qSyncCur() {
    if (!qOpen) return;
    var local = (curIdxShown || 0) - qStart;
    if (local >= 0 && local < qItems.length) {
      qList.scrollTop = Math.max(0, local * ROWH);
      qRender();
      qEdgeDetect();
    } else {
      qOpenLoad();
    }
  }
  function qSetOpen(open) {
    qOpen = !!open;

    $('dsh-qbtn').classList.toggle('active', qOpen);
    if (qOpen) qOpenLoad();
    else { sizer.innerHTML = ''; sizer.style.height = '0px'; qItems = []; }
  }
  function setQPanel(open) { qSetOpen(open); }   // 别名(hide / KeyQ 外部调用)

  // 交互:面板内点击/滚轮不冒泡;点行跳播;滚动驱动渲染+边缘拉段(rAF 节流)
  $('dsh-qbtn').onclick = function (e) { e.stopPropagation(); qSetOpen(!qOpen); };
  $('dsh-qclose').onclick = function (e) { e.stopPropagation(); qSetOpen(false); };
  $('dsh-qpanel').addEventListener('click', function (e) { e.stopPropagation(); });
  $('dsh-qpanel').addEventListener('wheel', function (e) { e.stopPropagation(); }, { passive: true });
  qList.addEventListener('click', function (e) {
    var row = e.target && e.target.closest ? e.target.closest('.qrow') : null;
    if (!row) return;
    post({ player: 'queueJump', index: parseInt(row.getAttribute('data-i'), 10) });
  });
  qList.addEventListener('scroll', function () {
    if (qRenderTick) return;
    qRenderTick = requestAnimationFrame(function () { qRenderTick = 0; qRender(); qEdgeDetect(); });
  });

  // ---------- 倍速(点击循环:0.75 → 1 → 1.25 → 1.5 → 2) ----------
  var RATES = [0.75, 1, 1.25, 1.5, 2], rateIdx = 1, playRate = 1;
  function rateLabel(r) { return (r % 1 === 0 ? r : r) + 'x'; }
  function applyRate() {
    playRate = RATES[rateIdx];
    try { video.playbackRate = playRate; } catch (e) {}
    var b = $('dsh-speed');
    if (b) { b.textContent = rateLabel(playRate); b.classList.toggle('on', playRate !== 1); }
  }
  $('dsh-speed').onclick = function (e) { e.stopPropagation(); rateIdx = (rateIdx + 1) % RATES.length; applyRate(); };

  // ---------- seek 快进/快退提示 ----------
  var seekTipTimer = null;
  function seekBy(sec) {
    if (slideImages.length > 0) return;
    try {
      var d = video.duration || 0;
      if (!d || !isFinite(d)) return;
      video.currentTime = Math.max(0, Math.min(d - 0.3, video.currentTime + sec));
    } catch (e) { return; }
    var tip = $('dsh-seektip');
    if (!tip) return;
    tip.textContent = (sec > 0 ? '+' : '') + sec + ' 秒';
    tip.style.opacity = '1';
    if (seekTipTimer) clearTimeout(seekTipTimer);
    seekTipTimer = setTimeout(function () { tip.style.opacity = '0'; }, 650);
  }

  // ---------- 时间码(当前/总时长) ----------
  function fmtT(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), x = Math.floor(s % 60);
    return m + ':' + (x < 10 ? '0' : '') + x;
  }
  video.addEventListener('timeupdate', function () {
    var tc = $('dsh-tcode');
    if (!tc) return;
    var d = video.duration || 0;
    tc.textContent = fmtT(video.currentTime) + (d > 0 && isFinite(d) ? ' / ' + fmtT(d) : '');
  });
  applyRate();
})();
</script>
</body>
</html>
