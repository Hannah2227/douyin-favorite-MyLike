<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLike</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-name">MyLike</div>
    </div>
    <div class="top-search">
      <input id="search" type="text" placeholder="搜索标题 / 作者" />
      <button class="top-btn primary" id="btn-search" title="执行搜索">搜索</button>
    </div>
    <div class="top-actions">
      <button class="top-btn primary" id="btn-tutorial" title="查看使用教程">使用教程</button>
      <button class="top-btn" id="btn-login" title="登录抖音">登录</button>
      <button class="top-btn danger hidden" id="btn-logout" title="清除登录信息">退出登录</button>
    </div>
    <div class="win-controls">
      <button class="wc-btn" id="win-min" title="最小化">&#8722;</button>
      <button class="wc-btn" id="win-max" title="最大化 / 还原">&#9634;</button>
      <button class="wc-btn wc-close" id="win-close" title="关闭">&#10005;</button>
    </div>
  </header>
  <div class="body">
    <nav class="sidenav">
      <div class="side-item active" id="nav-all">
        <span class="side-icon">&#9650;</span>
        <span class="side-label">全部</span>
        <span class="side-count" id="nav-all-count">0</span>
      </div>
      <div class="side-item" id="nav-gallery">
        <span class="side-icon">&#128247;</span>
        <span class="side-label">图集</span>
        <span class="side-count" id="nav-gallery-count">0</span>
      </div>
      <div class="side-item" id="nav-video">
        <span class="side-icon">&#127916;</span>
        <span class="side-label">视频</span>
        <span class="side-count" id="nav-video-count">0</span>
      </div>
      <div class="side-item" id="btn-refresh-list" title="手动刷新列表(采集/导入等操作后点击)">
        <span class="side-label">刷新</span>
      </div>
      <div class="side-help">
        <button class="help-btn primary" id="btn-faq" title="查看常见问题">&#10067; 常见问题</button>
      </div>
      <div class="side-foot" id="login-state">未登录</div>
    </nav>
    <main class="content">
      <!-- 采集进度条 -->
      <section class="collect-bar hidden" id="collect-bar">
        <div class="collect-main">
          <div class="collect-info">
            <span class="spinner"></span>
            <span id="collect-text">采集中…</span>
          </div>
          <button class="mini-btn" id="btn-stop-collect">停止</button>
        </div>
        <div class="collect-note">提示:最终采集数量可能与抖音显示的不一致(大量内容可能下架、删除),少几千到几万条为正常现象</div>
      </section>
      <section class="dashboard">
        <div class="dash-card">
          <div class="dash-left">
            <div class="dash-label">MY LIKES</div>
            <div class="dash-title">已采集 <b id="stat-total">0</b> 条</div>
            <div class="dash-sub" id="dash-sub">可洗牌播放或点击卡片播放。</div>
          </div>
          <button class="collect-btn" id="btn-collect" title="直连快采喜欢列表">
            <span class="heart">&#10084;</span>采集
          </button>
        </div>
        <div class="dash-stats">
          <div class="stat-box"><div class="s-v" id="stat-videos">0</div><div class="s-l">视频</div></div>
          <div class="stat-box"><div class="s-v" id="stat-gallery">0</div><div class="s-l">图集</div></div>
          <div class="stat-box"><div class="s-v" id="stat-invalid">0</div><div class="s-l">失效</div></div>
          <div class="stat-box"><div class="s-v" id="stat-years">0</div><div class="s-l">年份</div></div>
        </div>
      </section>
      <section class="list-toolbar">
        <div class="filters">
          <select id="year-filter"><option value="">全部年份</option></select>
          <select id="month-filter"><option value="">全部月份</option></select>
          <button class="top-btn primary" id="btn-shuffle" title="按当前筛选条件洗牌播放">洗牌播放</button>
          <label class="auto-next-toggle" id="auto-next-label" title="一条播放结束后自动播放下一条(默认关;播放中可按 A 或点播放页 🔁 切换)">
            <input type="checkbox" id="auto-next" />
            <span>自动连播</span>
          </label>
        </div>
        <div class="toolbar-actions">
          <button class="mini-btn" id="btn-select" title="进入选择模式">选择</button>
          <button class="mini-btn" id="btn-unlike-batch" title="按筛选条件批量取消点赞(全部/时间范围/作者)">批量取消</button>
          <span class="select-group hidden" id="select-group">
            <button class="mini-btn" id="btn-select-all">全选</button>
            <button class="mini-btn" id="btn-unselect">取消</button>
            <button class="mini-btn danger" id="btn-delete" title="只删除本地记录">删除</button>
            <button class="mini-btn" id="btn-unlike" title="取消选中内容在抖音上的点赞">取消点赞</button>
          </span>
          <button class="mini-btn" id="btn-export">导出</button>
          <button class="mini-btn" id="btn-import">导入</button>
          <span class="page-info" id="list-info">共 0 条</span>
        </div>
      </section>
      <section class="list-grid" id="list-grid"></section>
      <div class="load-more hidden" id="load-more">下拉加载更多…</div>
    </main>
  </div>
</div>
<div class="playing-bar hidden" id="playing-bar">
  <span id="playing-text"></span>
  <button class="mini-btn" id="btn-stop">停止</button>
</div>
<div class="playing-bar hidden" id="unlike-bar">
  <span id="unlike-text"></span>
  <button class="mini-btn" id="btn-unlike-stop">停止</button>
</div>
<div class="toast" id="toast"></div>
<!-- 帮助弹窗(使用教程 / 常见问题) -->
<div class="modal-mask hidden" id="help-modal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title" id="help-title">帮助</span>
      <button class="modal-close" id="help-close" title="关闭(Esc)">&#10005;</button>
    </div>
    <div class="modal-body" id="help-body"></div>
  </div>
</div>
<!-- 批量取消点赞弹窗(筛选范围 + 取消模式) -->
<div class="modal-mask hidden" id="unlike-batch-modal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title">批量取消点赞</span>
      <button class="modal-close" id="unlike-batch-close" title="关闭(Esc)">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="ub-row">
        <span class="ub-label">筛选范围</span>
        <label class="ub-opt"><input type="radio" name="ub-scope" value="all" checked /> 全部</label>
        <label class="ub-opt"><input type="radio" name="ub-scope" value="time" /> 按时间范围</label>
        <label class="ub-opt"><input type="radio" name="ub-scope" value="author" /> 按作者</label>
      </div>
      <div class="ub-cond hidden" id="ub-time-cond">
        <span class="ub-label">时间范围</span>
        <input type="date" id="ub-time-start" />
        <span class="ub-sep">至</span>
        <input type="date" id="ub-time-end" />
      </div>
      <div class="ub-cond hidden" id="ub-author-cond">
        <span class="ub-label">作者</span>
        <input type="text" id="ub-author" placeholder="输入作者昵称(精确匹配,多个用逗号分隔)" />
      </div>
      <div class="ub-row">
        <span class="ub-label">取消模式</span>
        <label class="ub-opt"><input type="radio" name="ub-mode" value="all" checked /> 全部取消</label>
        <label class="ub-opt"><input type="radio" name="ub-mode" value="selective" /> 选择性取消</label>
      </div>
      <div class="ub-preview" id="ub-preview">匹配 0 条</div>
      <div class="ub-actions">
        <button class="ub-btn primary" id="ub-start">开始取消</button>
        <button class="ub-btn" id="ub-retry" title="重试上次未成功的条目">重试失败项</button>
      </div>
    </div>
  </div>
</div>
<script src="ui.js"></script>
</body>
</html>
